name: Release

on:
  push:
    tags:
      - "v*"
  # Builds and signs the app on PRs too, so packaging breaks show up before a release.
  pull_request:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-26
    env:
      APP_NAME: QwenWhisper
      EXECUTABLE_NAME: QwenWhisperApp
      BUNDLE_ID: com.hukopo.qwenwhisper
      SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
      DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
      BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Import signing certificate
        if: ${{ env.DEVELOPER_ID_APPLICATION_CERT_BASE64 != '' && env.DEVELOPER_ID_APPLICATION_CERT_PASSWORD != '' && env.BUILD_KEYCHAIN_PASSWORD != '' }}
        env:
          CERT_BASE64: ${{ env.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ env.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ env.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package release artifacts
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-pr' }}
        run: |
          set -euo pipefail
          VERSION_NUMBER="${VERSION#v}"
          # An unsigned release gets a new identity, so every user would have to re-grant permissions.
          if [[ "${{ github.ref_type }}" == tag && -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::Signing secrets are missing; refusing to publish an unsigned release."
            exit 1
          fi
          ./scripts/package_release.sh "$VERSION_NUMBER"
          codesign -d -r- dist/QwenWhisper.app

      - name: Upload PR build
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: QwenWhisper-pr
          path: dist/QwenWhisper-*-macos-arm64.zip
          retention-days: 7

      - name: Notarize DMG
        if: ${{ github.ref_type == 'tag' && startsWith(env.SIGNING_IDENTITY, 'Developer ID') && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION_NUMBER="${VERSION#v}"
          ./scripts/notarize_release.sh "dist/QwenWhisper-${VERSION_NUMBER}-macos-arm64.dmg"

      - name: Publish release assets
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QwenWhisper-*-macos-arm64.zip
            dist/QwenWhisper-*-macos-arm64.dmg
          generate_release_notes: true
